# The native BÃ¹bÃ¹ app. XcodeGen turns this into Bubu.xcodeproj (on the Mac or in Codemagic):
#   brew install xcodegen && cd native && xcodegen generate
name: Bubu
options:
  bundleIdPrefix: com.bubu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.57"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bubu:
    type: application
    platform: iOS
    sources:
      - path: Bubu
    info:
      path: Bubu/Info.plist
      properties:
        CFBundleDisplayName: æ­¥æ­¥ BÃ¹bÃ¹
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Nunito-Regular.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf
          - MaShanZheng-Bubu.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: BÃ¹bÃ¹ listens when you practise speaking, to check your pronunciation.
        NSSpeechRecognitionUsageDescription: BÃ¹bÃ¹ uses speech recognition to check the Chinese you say in speaking practice.
        ITSAppUsesNonExemptEncryption: false
        # let the pen (and animations) run at 120 Hz on ProMotion iPhones
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bubu
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  BubuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BubuTests
    dependencies:
      - target: Bubu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bubu:
    build:
      targets:
        Bubu: all
        BubuTests: [test]
    test:
      targets:
        - BubuTests
