# Codemagic cloud builds for 步步 Bùbù (iOS). Docs: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
workflows:
  # Needs no Apple account: builds for the iPhone simulator, launches the app and
  # takes screenshots, so compile errors and the running app can be checked
  # without a Mac at hand.
  ios-simulator-check:
    name: iOS simulator check
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install
        script: npm ci
      - name: Copy the web app into the iOS project
        script: npx cap sync ios
      - name: Build for the simulator
        script: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*(deprecated|Swift)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: Launch in the simulator and take screenshots
        script: |
          mkdir -p screenshots
          TYPE=$(xcrun simctl list devicetypes | grep -E "iPhone 1[5-9]( |$)" | grep -v Plus | grep -v Max | tail -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          UDID=$(xcrun simctl create bubu "$TYPE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.bubu
          sleep 15; xcrun simctl io "$UDID" screenshot screenshots/1-launch.png
          sleep 20; xcrun simctl io "$UDID" screenshot screenshots/2-after-35s.png
          xcrun simctl ui "$UDID" appearance dark; sleep 5
          xcrun simctl io "$UDID" screenshot screenshots/3-dark.png
    artifacts:
      - screenshots/*.png
      - build.log

  # The native SwiftUI app in native/: generates the Xcode project, runs the unit
  # tests, then launches each screen in the simulator in light and dark.
  native-check:
    name: Native app check
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd native && xcodegen generate
          # the ready-to-open project, for building on a Mac with nothing but Xcode
          zip -qr ../Bubu-Xcode-project.zip . -x "*.DS_Store"
      - name: Create a simulator
        script: |
          TYPE=$(xcrun simctl list devicetypes | grep -E "iPhone 1[5-9]( |$)" | grep -v Plus | grep -v Max | tail -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          UDID=$(xcrun simctl create bubu "$TYPE")
          echo "UDID=$UDID" >> $CM_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Unit tests
        script: |
          set -o pipefail
          cd native
          xcodebuild -project Bubu.xcodeproj -scheme Bubu -destination "id=$UDID" \
            -derivedDataPath ../build CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ../test.log \
            | grep -E "error:|Test Case .*(failed)|XCTAssert|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)"
      - name: Screenshots
        script: |
          mkdir -p screenshots
          APP=$(find build/Build/Products -name "Bubu.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          # if the app is stuck, record where its main thread is
          xcrun simctl launch "$UDID" com.bubu
          sleep 10
          sample Bubu 3 -file screenshots/launch-sample.txt || true
          xcrun simctl terminate "$UDID" com.bubu || true
          for MODE in light dark; do
            xcrun simctl ui "$UDID" appearance $MODE
            for S in home path lesson study quiz sentence sentencedrag speak write done char settings chars guide story tones profile avatar welcome account hud buns shop pocket remind; do
              xcrun simctl terminate "$UDID" com.bubu || true
              xcrun simctl launch "$UDID" com.bubu -screen $S
              sleep 6
              xcrun simctl io "$UDID" screenshot screenshots/$S-$MODE.png
            done
          done
    artifacts:
      - screenshots/*.png
      - screenshots/*.txt
      - test.log
      - Bubu-Xcode-project.zip

  # Signs the native app and sends it to TestFlight (private testing only; nothing
  # goes to the App Store). Signing is automatic through the App Store Connect API
  # key saved in Codemagic as "Bubu ASC". Each build gets the next build number.
  testflight:
    name: TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Bubu ASC
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bubu
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd native && xcodegen generate
      - name: Use the signing profiles
        script: xcode-project use-profiles --project native/Bubu.xcodeproj
      - name: Build the app for TestFlight
        script: |
          # the next build number after the newest one App Store Connect has
          LATEST=$(app-store-connect get-latest-testflight-build-number --bundle-id com.bubu 2>/dev/null || echo 0)
          NEXT=$(( ${LATEST:-0} + 1 ))
          echo "Build number $NEXT"
          xcode-project build-ipa --project native/Bubu.xcodeproj --scheme Bubu \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$NEXT"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
